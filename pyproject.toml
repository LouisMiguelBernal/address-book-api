[project]
name = "address-book-api"
version = "1.0.0"
description = "Address book API with distance search, built with FastAPI and SQLite."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Emitted inside Starlette's TestClient, not by this project.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in defaults is the intended pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
